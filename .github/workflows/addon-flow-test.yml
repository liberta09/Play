name: Addon flow test

on:
  push:
    branches:
      - feature/add-source-type-dialog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-37,build-tools;36.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload debug APK for LDPlayer testing
        uses: actions/upload-artifact@v4
        with:
          name: Play-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
